[package]
name = "aura"
version = "0.1.0"
description = "Aura Knowledge Engine"
authors = ["Aura"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP server for the MCP endpoint
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Filesystem monitoring
notify = "6.1"
notify-debouncer-full = "0.3"
ignore = "0.4"

# Markdown
pulldown-cmark = { version = "0.12", default-features = false }

# Database
libsql = { version = "0.6", default-features = false, features = ["core"] }

# Identifiers, hashing, time
uuid = { version = "1.10", features = ["v7"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

# Concurrency primitives
dashmap = "6.1"
parking_lot = "0.12"
rayon = "1.10"

# Random
rand = "0.8"
rand_chacha = "0.3"

# Error handling & logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for downloading the embeddings model on first run + the
# Anthropic Messages API. `json` feature: serde-aware POST bodies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# Pure-Rust ONNX runtime for the all-MiniLM-L6-v2 embedder (Phase 5).
# tract-onnx avoids the C++ ONNX Runtime dependency and is portable to
# every platform Tauri runs on.
tract-onnx = { version = "0.21", default-features = false }

# Image decode + resize + colour normalise for the SigLIP vision
# encoder (#6 media). PNG / JPEG / WEBP / GIF are enough for the
# `detect_kind` set Aura indexes; turning off the long-tail formats
# keeps the build small.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

# WAV decode for the Whisper-tiny audio encoder (#6 media). Lightweight
# — pure Rust, no symphonia. Mp3/m4a/ogg support is a later gate that
# adds symphonia.
hound = "3.5"

# FFT for Whisper's mel-spectrogram. Pure-Rust, transitively pulled
# in by tract-onnx already; declaring it as a direct dep so we can
# `use rustfft::*` without `extern crate` gymnastics.
rustfft = "6"

# Hugging Face tokenizers (pure Rust). Used to tokenize input text before
# running it through the MiniLM ONNX graph.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# async fn in traits with object-safety. Used by the AIProvider trait so we
# can put Anthropic / OpenAI / Ollama behind an `Arc<dyn AIProvider>`.
async-trait = "0.1"
ort = { version = "2.0.0-rc.9", features = ["download-binaries", "half"], optional = true }
age = { version = "0.11.3", default-features = false, features = ["armor"] }

[features]
# default Tauri custom-protocol feature for production builds
custom-protocol = ["tauri/custom-protocol"]
ort = ["dep:ort"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
